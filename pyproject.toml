[project]
name = "jevmon"
version = "0.1.0"
description = "Jev monitors for multi-agent collusion (offline evaluation on NARCBench)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "huggingface-hub>=0.24",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevmon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
